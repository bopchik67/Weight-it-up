.tools { display: flex; gap: 8px; }

.status b { color: var(--ink); font-weight: 700; }
.progress { height: 4px; border-radius: 2px; background: var(--line); overflow: hidden; margin-top: -8px; }
.progress i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .4s ease; }

.stage { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 14px 14px 16px; display: grid; gap: 6px; }

#scale .brass { fill: var(--brass); }

#scale .steel { fill: var(--steel); }
#scale .steel-deep { fill: var(--steel-deep); }

#scale .string { stroke: var(--steel-deep); stroke-width: 1.6; fill: none; stroke-linecap: round; }
#scale .rim { stroke: var(--brass-deep); stroke-width: 4; stroke-linecap: round; fill: none; }
#scale .needle { stroke: var(--brass-deep); stroke-width: 3; stroke-linecap: round; }

.panel { display: grid; gap: 14px; }

.fine { margin: 0; color: var(--muted); font-size: 13px; }

.seg { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; }

.seg label { position: relative; }

.seg span { display: inline-block; min-width: 56px; text-align: center; padding: 10px 16px; border-radius: 12px; border: 2px solid var(--line); font: 700 15px var(--font-mono); background: var(--surface); }

.btn { appearance: none; border: 0; border-radius: 14px; min-height: 48px; padding: 12px 20px; font: 600 16px/1.2 var(--font-body); cursor: pointer; }

.ask { display: grid; gap: 10px; }
.ask-q { margin: 0; font-weight: 600; font-size: 17px; text-wrap: balance; }
.lbl { font: 600 12px/1 var(--font-body); letter-spacing: .09em; text-transform: uppercase; color: var(--muted); }
.field { display: flex; align-items: center; gap: 12px; }
.field input { flex: 1 1 0; min-width: 0; width: 100%; font: 700 30px/1.2 var(--font-mono); font-variant-numeric: tabular-nums; padding: 10px 16px; border-radius: 14px; border: 2px solid var(--line); background: var(--surface); color: var(--ink); }
.field input:focus { outline: none; border-color: var(--accent); }
.field input:disabled { opacity: .7; }
.unit { flex: 0 1 42%; font-size: 15px; line-height: 1.3; color: var(--muted); overflow-wrap: anywhere; }
.ask.locked .actions, .ask.locked .hint-btn { display: none; }
.hint { margin: 0; padding: 10px 14px; border-radius: 12px; background: var(--surface); border: 1px dashed var(--steel-deep); font-size: 15px; }

.result { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 18px; display: grid; gap: 14px; }
.res-top { display: grid; grid-template-columns: auto 1fr; gap: 16px; align-items: center; }
.pct { font: 800 clamp(44px, 14vw, 68px)/1 var(--font-display); font-variant-numeric: tabular-nums; display: flex; align-items: baseline; }

.res-txt { min-width: 0; }

    if (p >= 75) return 'Очень близко';
    if (p >= 50) return 'Неплохо, но мимо';
    if (p >= 20) return 'Далековато';
    return 'Совсем мимо';
  }
  function pctClass(p) { return p >= 80 ? 'p-good' : p >= 50 ? 'p-warn' : 'p-bad'; }

  /* ---------- сохранение рекорда ---------- */
  function loadBest() {
    try { return JSON.parse(localStorage.getItem('wiu-best') || '{}') || {}; } catch (e) { return {}; }
  }
  function saveBest(obj) {
    try { localStorage.setItem('wiu-best', JSON.stringify(obj)); } catch (e) {}
  }

  /* ---------- весы: рисование и пружина ---------- */
  var ang = 0, vel = 0, target = 0, raf = 0, lastT = 0;
  var L = 140;
  function draw() {
    var rad = ang * Math.PI / 180, cs = Math.cos(rad), sn = Math.sin(rad);
    el.beam.setAttribute('transform', 'rotate(' + ang.toFixed(3) + ' 210 70)');
    el.panL.setAttribute('transform', 'translate(' + (210 - L * cs).toFixed(2) + ' ' + (70 - L * sn).toFixed(2) + ')');
    el.panR.setAttribute('transform', 'translate(' + (210 + L * cs).toFixed(2) + ' ' + (70 + L * sn).toFixed(2) + ')');
  }
  function tick(now) {
    var dt = Math.min(0.033, (now - lastT) / 1000);
    lastT = now;
    var k = 70, c = 5.2;
    vel += (-k * (ang - target) - c * vel) * dt;
    ang += vel * dt;
    if (Math.abs(ang - target) < 0.02 && Math.abs(vel) < 0.05) {
      ang = target; vel = 0; raf = 0; draw(); return;
    }
    draw();
    raf = requestAnimationFrame(tick);
  }
  function setTarget(t) {
    target = t;
    if (RM) { ang = t; vel = 0; draw(); return; }
    if (!raf) { lastT = performance.now(); raf = requestAnimationFrame(tick); }
  }
  function snapTo(t) { ang = t; target = t; vel = 0; draw(); }

  function glyph(it, x, y, s) {
    if (it.draw === 'tennis') {
      return '<g transform="translate(' + x.toFixed(1) + ' ' + (y - s * 0.42).toFixed(1) + ') scale(' + (s / 100).toFixed(3) + ')">' +
        '<circle r="44" fill="#D5E43B" stroke="#9FB021" stroke-width="2"/>' +
        '<path d="M-30 -31 Q-8 0 -30 31 M30 -31 Q8 0 30 31" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round"/></g>';
    }
    return '<text class="em" x="' + x.toFixed(1) + '" y="' + y.toFixed(1) + '" font-size="' + s + '">' + it.e + '</text>';
  }
  function setPanLabel(node, name) {
    name = cap1(name);
    var words = name.split(' '), lines = [name];
    if (name.length > 13 && words.length > 1) {
      var bestK = 1, bestD = 1e9;
      for (var k = 1; k < words.length; k++) {
        var d = Math.abs(words.slice(0, k).join(' ').length - words.slice(k).join(' ').length);
        if (d < bestD) { bestD = d; bestK = k; }
      }
      lines = [words.slice(0, bestK).join(' '), words.slice(bestK).join(' ')];
    }
    node.innerHTML = lines.map(function (t, i) {
      return '<text class="plabel" x="0" y="' + (160 + i * 17) + '">' + t + '</text>';
    }).join('');
  }
  function setPanLabels(a, b) { setPanLabel(el.lblL, a.f[0]); setPanLabel(el.lblR, b.f[0]); }
  function renderLeft(it) {
    el.itemsL.innerHTML = glyph(it, 0, 100, 64);
  }
  function renderPile(n, it) {
    if (!(n > 0)) {
      el.itemsR.innerHTML = '<g class="ghost">' + glyph(it, 0, 100, 52) + '</g><text class="qbadge" x="0" y="46">?</text>';
      return;
    }
    var vis = Math.min(n, 15);
    var s = vis <= 1 ? 46 : vis <= 3 ? 38 : vis <= 6 ? 30 : vis <= 10 ? 25 : 21;
    var perRow = Math.max(1, Math.floor(112 / (s * 0.92)));
    var out = '';
    for (var i = 0; i < vis; i++) {
      var row = Math.floor(i / perRow), idx = i % perRow;
      var rowCount = Math.min(perRow, vis - row * perRow);
      var x = (idx - (rowCount - 1) / 2) * s * 0.95;
      var y = 103 - row * s * 0.8;
      out += glyph(it, x, y, s);
    }
    el.itemsR.innerHTML = out;
  }
  function setRightCaption(n, it) {
    if (n > 0) {
      el.capRCount.textContent = '× ' + fmt(n);
      el.capRName.textContent = plural(n, it.f);
    } else {
      el.capRCount.textContent = '× ?';
      el.capRName.textContent = it.f[2];
    }
  }

  /* ---------- состояние игры ---------- */
  var S = { total: 10, idx: 0, results: [], used: {}, cur: null };
  var idleTimer = 0, idleDir = -1;

  function show(phase) {
    el.start.hidden = phase !== 'start';
    el.play.hidden = phase !== 'play';
    el.fin.hidden = phase !== 'final';
    el.stage.hidden = phase === 'final';
    el.status.hidden = phase !== 'play';
    el.tools.hidden = phase !== 'play';
    if (el.restartBtn._disarm) { el.restartBtn._disarm(); el.exitBtn._disarm(); }
    el.progress.hidden = phase !== 'play';
  }
  function updateStatus() {
    el.stRound.textContent = Math.min(S.idx + 1, S.total);
    el.stTotal.textContent = S.total;
    var n = S.results.length;
    var sum = 0;
    for (var i = 0; i < n; i++) sum += S.results[i].pct;
    el.stAvg.textContent = n ? Math.round(sum / n) + '%' : '—';
    var done = S.idx + (S.cur && S.cur.done ? 1 : 0);
    el.bar.style.width = (done / S.total * 100) + '%';
  }

  function updateBest() {
    var chosen = document.querySelector('input[name="rounds"]:checked');
    var v = loadBest()[chosen ? chosen.value : '10'];
    el.best.hidden = v == null;
    if (v != null) el.best.textContent = 'Рекорд: ' + v + '%';
  }
  function restartGame() {
    S.idx = 0; S.results = []; S.used = {}; S.cur = null;
    show('play');
    beginRound();
  }
  function armable(btn, label, armedLabel, action) {
    var timer = 0;
    function disarm() { btn.classList.remove('armed'); btn.textContent = label; clearTimeout(timer); }
    btn._disarm = disarm;
    btn.addEventListener('click', function () {
      if (btn.classList.contains('armed') || !S.results.length) { disarm(); action(); return; }
      btn.classList.add('armed');
      btn.textContent = armedLabel;
      timer = setTimeout(disarm, 3000);
    });
  }
  function flipIdle() { idleDir *= -1; setTarget(idleDir * 5); }
  function startIdle(kick) {
    clearInterval(idleTimer);
    if (RM) return;
    if (kick) flipIdle();
    idleTimer = setInterval(flipIdle, 1400);
  }
  function goStart() {
    show('start');
    var g = ITEMS.filter(function (i) { return i.f[0] === 'жираф'; })[0];
    var t = ITEMS.filter(function (i) { return i.f[0] === 'теннисный мяч'; })[0];
    el.capL.textContent = cap1(g.f[0]);
    renderLeft(g);
    setPanLabels(g, t);
    renderPile(9, t);
    el.capRCount.textContent = '× ?';
    el.capRName.textContent = t.f[2];
    snapTo(-5);
    idleDir = -1;
    startIdle(true);
    updateBest();
  }

  function startGame() {
    var chosen = document.querySelector('input[name="rounds"]:checked');
    S.total = chosen ? parseInt(chosen.value, 10) : 10;
    S.idx = 0; S.results = []; S.used = {}; S.cur = null;
    clearInterval(idleTimer);
    show('play');
    beginRound();
  }

  function beginRound() {
    var seenList = loadSeen(), seen = {};
    seenList.forEach(function (k) { seen[k] = true; });
    var pair = pickPair(S.idx, S.total, S.used, seen);
    var a = pair[0], b = pair[1];
    S.used[a.id] = true; S.used[b.id] = true;
    seenList.push(a.id, b.id);
    saveSeen(seenList);
    S.cur = { a: a, b: b, c: Math.round(a.kg / b.kg), hint: false, done: false };
    el.guess.value = '';
    el.guess.disabled = false;
    el.weigh.disabled = true;
    el.ask.classList.remove('locked');
    el.hint.hidden = true;
    el.hintBtn.disabled = false;
    el.hintBtn.textContent = 'Подсказка · −25%';
    el.result.hidden = true;
    el.result.innerHTML = '';
    el.capL.textContent = cap1(a.f[0]);
    renderLeft(a);
    setPanLabels(a, b);
    renderPile(0, b);
    setRightCaption(0, b);
    el.unit.textContent = b.f[2];
    updateStatus();
    setTarget(0);
    var fine = true;
    try { fine = window.matchMedia('(pointer: fine)').matches; } catch (e) {}
    if (fine) { try { el.guess.focus({ preventScroll: true }); } catch (e) {} }
  }

  function currentGuess() {
    var v = parseInt(el.guess.value, 10);
    return isNaN(v) ? 0 : v;
  }
  function onInput() {
    var v = el.guess.value.replace(/\D/g, '').replace(/^0+/, '').slice(0, 9);
    if (v !== el.guess.value) el.guess.value = v;
    var g = currentGuess();
    el.weigh.disabled = !(g > 0);
    var b = S.cur.b;
    setRightCaption(g, b);
    el.unit.textContent = plural(g > 0 ? g : 5, b.f);
  }

  function useHint() {
    var cur = S.cur;
    if (!cur || cur.done || cur.hint) return;
    cur.hint = true;
    el.hint.hidden = false;
    el.hint.innerHTML = 'Подсказка: ' + cur.b.f[0] + ' весит <b>≈ ' + fmtMass(cur.b.kg) + '</b>. Итоговая точность раунда будет умножена на 0,75.';
    el.hintBtn.disabled = true;
    el.hintBtn.textContent = 'Подсказка использована';
  }

  function countUp(node, to) {
    if (RM || to === 0) { node.textContent = to; return; }
    var t0 = performance.now(), dur = 900;
    function step(now) {
      var p = Math.min(1, (now - t0) / dur);
      var e = 1 - Math.pow(1 - p, 3);
      node.textContent = Math.round(to * e);
      if (p < 1) requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  }

  function submit() {
    var cur = S.cur;
    if (!cur || cur.done) return;
    var g = currentGuess();
    if (!(g > 0)) return;
    cur.done = true;
    var c = cur.c;
    var base = accuracy(g, c);
    var pct = cur.hint ? Math.round(base * HINT_PENALTY) : base;
    S.results.push({ a: cur.a, b: cur.b, g: g, c: c, pct: pct, hint: cur.hint });

    el.guess.disabled = true;
    el.ask.classList.add('locked');
    el.hint.hidden = true;
    renderPile(1, cur.b);
    setTarget(g === c ? 0 : tiltFor(g, c));

    var f = Math.max(g / c, c / g);
    var diff;
    if (g === c) diff = 'точно';
    else {
      var fv = f >= 10 ? Math.round(f) : Math.round(f * 10) / 10;
      var isInt = Math.abs(fv - Math.round(fv)) < 1e-9;
      var word = isInt ? plural(Math.round(fv), ['раз', 'раза', 'раз']) : 'раза';
      diff = 'в ' + (isInt ? fmt(fv) : nf1.format(fv)) + ' ' + word + (g < c ? ' меньше' : ' больше');
    }
    var dirText = g === c ? 'Весы в равновесии.'
      : f < 1.03 ? 'Весы почти в равновесии.'
      : g < c ? 'Мало: левая чаша перевесила.'
      : 'Много: правая чаша перевесила.';

    var html = '' +
      '<div class="res-top">' +
        '<div class="pct ' + pctClass(pct) + '"><span id="pctNum">0</span><small>%</small></div>' +
        '<div class="res-txt"><h2>' + verdictFor(base) + '</h2><p>' + dirText + '</p></div>' +
      '</div>' +
      '<dl class="facts">' +
        '<dt>Правильный ответ</dt><dd>' + fmt(c) + '</dd>' +
        '<dt>Ваш ответ</dt><dd>' + fmt(g) + '</dd>' +
        '<dt>Отличие</dt><dd>' + diff + '</dd>' +
        '<dt>Массы</dt><dd>' + cur.a.f[0] + ' ≈ ' + fmtMass(cur.a.kg) + '<br>' + cur.b.f[0] + ' ≈ ' + fmtMass(cur.b.kg) + '</dd>' +
        (cur.hint ? '<dt>Подсказка</dt><dd>' + base + '% × 0,75</dd>' : '') +
      '</dl>' +
      '<button class="btn primary" id="nextBtn" type="button">' + (S.idx + 1 >= S.total ? 'Показать итоги' : 'Следующий раунд') + '</button>';
    el.result.innerHTML = html;
    el.result.hidden = false;
    countUp($('pctNum'), pct);
    updateStatus();
    var nb = $('nextBtn');
    try { nb.focus({ preventScroll: true }); } catch (e) {}
    try { el.result.scrollIntoView({ block: 'nearest', behavior: RM ? 'auto' : 'smooth' }); } catch (e) {}
  }

  function next() {
    S.idx++;
    if (S.idx >= S.total) finish(); else beginRound();
  }

  function finish() {
    var n = S.results.length, sum = 0, hints = 0;
    S.results.forEach(function (r) { sum += r.pct; if (r.hint) hints++; });
    var avg = Math.round(sum / n);
    var best = loadBest(), key = String(S.total);
    var record = best[key] == null || avg > best[key];
    var prev = best[key];
    if (record) { best[key] = avg; saveBest(best); }

    var rows = S.results.map(function (r) {
      return '<li class="row ' + pctClass(r.pct) + '">' +
        '<div class="row-t" style="color:var(--ink)"><span class="emo">' + r.a.e + '</span> ' + cap1(r.a.f[0]) + ' ↔ <span class="emo">' + r.b.e + '</span> ' + r.b.f[0] + '</div>' +
        '<div class="row-p">' + r.pct + '%</div>' +
        '<div class="row-n">ваш ответ ' + fmt(r.g) + ', верно ' + fmt(r.c) + (r.hint ? ', с подсказкой' : '') + '</div>' +
        '<div class="row-bar"><i style="--p:' + r.pct + '%"></i></div>' +
        '</li>';
    }).join('');

    var recLine = record
      ? (prev == null ? 'Первый результат в режиме на ' + S.total + ' раундов.' : 'Новый рекорд. Прошлый был ' + prev + '%.')
      : 'Рекорд в этом режиме: ' + best[key] + '%.';

    el.fin.innerHTML =
      '<div class="fin-top">' +
        '<p class="eyebrow">Итоги · ' + S.total + ' ' + plural(S.total, ['раунд', 'раунда', 'раундов']) + '</p>' +
        '<div class="pct ' + pctClass(avg) + '"><span>' + avg + '</span><small>%</small></div>' +
        '<h2 class="rank">' + rankFor(avg) + '</h2>' +
        '<p class="sub">Средняя точность. ' + recLine + (hints ? ' Подсказок использовано: ' + hints + '.' : '') + '</p>' +
      '</div>' +
      '<ol class="rows">' + rows + '</ol>' +
      '<div class="actions"><button class="btn primary" id="againBtn" type="button">Сыграть ещё раз</button>' +
      '<button class="btn ghost" id="menuBtn" type="button">В начало</button></div>';
    show('final');
    setTarget(0);
    try { window.scrollTo({ top: 0, behavior: RM ? 'auto' : 'smooth' }); } catch (e) {}
  }

  /* ---------- события ---------- */
  el.startBtn.addEventListener('click', startGame);
  el.guess.addEventListener('input', onInput);
  el.guess.addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); submit(); } });
  el.weigh.addEventListener('click', submit);
  el.hintBtn.addEventListener('click', useHint);
  document.addEventListener('pointerdown', function (e) {
    if (document.activeElement === el.guess && !e.target.closest('#guess, button, label')) el.guess.blur();
  });
  el.result.addEventListener('click', function (e) { if (e.target.closest('#nextBtn')) next(); });
  el.fin.addEventListener('click', function (e) {
    if (e.target.closest('#againBtn')) restartGame();
    else if (e.target.closest('#menuBtn')) goStart();
  });

  armable(el.restartBtn, 'Заново', 'Точно заново?', restartGame);
  armable(el.exitBtn, 'В лобби', 'Точно выйти?', goStart);
  Array.prototype.forEach.call(document.querySelectorAll('input[name="rounds"]'), function (r) { r.addEventListener('change', function () { updateBest(); if (!el.start.hidden) startIdle(true); }); });

  goStart();
})();
</script>

</body></html>
